<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <h2 class="footer-heading">{{ site.title | escape }}</h2>
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name"><a href="{{ site.author.url }}">{{ site.author.name | escape }}</a></li>
          <li>{{ site.author.bio | escape }}</li>
        </ul>
      </div>
      <div class="footer-col footer-col-2">
        <ul class="contact-list">
          <li><a href="/recommended/">Recommended gear</a></li>
          <li><a href="/about/">About &amp; editorial policy</a></li>
          <li><a href="https://ductsoncall-hub.github.io/ductsoncall-madison/">Ducts On Call, Madison WI</a></li>
          <li><a href="{{ "/feed.xml" | relative_url }}">RSS feed</a></li>
        </ul>
      </div>
      <div class="footer-col footer-col-3">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>
  </div>
</footer>
